name: Release Fyrtaarn

# Tag-push release: builds all targets (via build-binaries.yml) and
# publishes a GitHub release for the pushed tag, e.g.
#   git tag 0.6.6 && git push origin 0.6.6
# Tags have no "v" prefix (since 0.6.3), matching the README changelog.
# Publish Release's own tag push does not trigger this: pushes made with
# GITHUB_TOKEN start no workflow runs.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: ${{ github.ref_name }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum fyrtaarn-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Fyrtaarn ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          # Whatever build-binaries.yml produced — no second target list to drift.
          files: |
            dist/fyrtaarn-*
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
