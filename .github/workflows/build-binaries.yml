name: Build Binaries

# The one build definition: target matrix, toolchain and build flags.
# Called by build-fyrtaarn.yml (artefacts only), publish.yml (manual
# release) and release.yml (tag-push release), so the three cannot drift
# apart. Each binary is uploaded as an artefact named after the file.
#
# Actions are pinned to full commit SHAs because this also runs inside the
# release workflows; Dependabot keeps the pins and "# vX.Y.Z" comments current.

on:
  workflow_call:
    inputs:
      version:
        description: "Version stamped into main.Version; empty means git describe"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.binary }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary: fyrtaarn-linux-amd64
          - goos: linux
            goarch: arm64
            binary: fyrtaarn-linux-arm64
          - goos: linux
            goarch: arm
            goarm: 7
            binary: fyrtaarn-linux-armv7
          - goos: linux
            goarch: ppc64
            binary: fyrtaarn-linux-ppc64
          - goos: linux
            goarch: mipsle
            gomips: softfloat
            binary: fyrtaarn-linux-mipsel
          - goos: linux
            goarch: mips64le
            gomips64: softfloat
            binary: fyrtaarn-linux-mips64el
          - goos: darwin
            goarch: amd64
            binary: fyrtaarn-darwin-amd64
          - goos: darwin
            goarch: arm64
            binary: fyrtaarn-darwin-arm64
          - goos: windows
            goarch: amd64
            binary: fyrtaarn-windows-amd64.exe
          - goos: windows
            goarch: arm64
            binary: fyrtaarn-windows-arm64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, so git describe gives a version, not a bare hash

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Tidy and download dependencies
        run: go mod tidy

      - name: Build
        env:
          GOOS:          ${{ matrix.goos }}
          GOARCH:        ${{ matrix.goarch }}
          GOARM:         ${{ matrix.goarm }}
          GOMIPS:        ${{ matrix.gomips }}
          GOMIPS64:      ${{ matrix.gomips64 }}
          CGO_ENABLED:   0
          # Via env, not ${{ }} in the script, so the value cannot inject shell.
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          VERSION="${VERSION_INPUT:-$(git describe --tags --always --dirty)}"
          mkdir -p dist
          go build \
            -ldflags "-X main.Version=${VERSION} \
                      -X main.Commit=$(git rev-parse --short HEAD) \
                      -X main.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/${{ matrix.binary }} \
            ./cmd/fyrtaarn

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.binary }}
          path: dist/${{ matrix.binary }}
