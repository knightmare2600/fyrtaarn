name: Publish Release

# Triggered only by a manual "Run workflow" click in the GitHub Actions UI.
# Builds all targets (via build-binaries.yml), creates the git tag, and
# publishes the GitHub release with binaries and a SHA256 checksum file.
#
# release.yml remains for tag-push releases from the command line. The two
# do not interfere — GITHUB_TOKEN tag pushes do not re-trigger workflows.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version — no v prefix (e.g. 0.6.6); matches the README changelog heading"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: ${{ github.event.inputs.version }}

  release:
    name: Tag and Publish
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create and push tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Via env, not ${{ }} in the script, so the value cannot inject shell.
          VERSION: ${{ github.event.inputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum fyrtaarn-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name:             ${{ github.event.inputs.version }}
          name:                 Fyrtaarn ${{ github.event.inputs.version }}
          prerelease:           ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
          # Whatever build-binaries.yml produced — no second target list to drift.
          files: |
            dist/fyrtaarn-*
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
